<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Campus Ballot">
  <!--
    The header BrandMark, reduced until it survives a 16px tab.

    Anything thinner than about 1.5px at that size disappears, which took out
    the lid, the outline strokes and the folded slot rim. What is left is three
    solid masses: the brand tile, a white ballot box with its slot, and the
    gold check above it. Gold is the only warm colour in the palette, so it is
    what makes the tab recognisable among twenty others.

    Run `npm run icons` after editing this: favicon.ico and apple-icon.png are
    generated from it, and its preview prints the 16px result as text.
  -->
  <rect width="32" height="32" rx="7.5" fill="#1d3f9e"/>
  <path d="m10 8.8 3.5 3.5 8-8" fill="none" stroke="#e0b45e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="4" y="15.5" width="24" height="13" rx="2.8" fill="#ffffff"/>
  <rect x="9.8" y="19.4" width="12.4" height="2.6" rx="1.3" fill="#1d3f9e"/>
</svg>
